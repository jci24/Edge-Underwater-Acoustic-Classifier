[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-underwater-acoustic-classifier"
version = "0.1.0"
description = "Reproducible preprocessing for edge underwater vessel classification"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.8,<4",
    "pandas>=2.2,<4",
    "scikit-learn==1.9.0",
    "scipy>=1.13,<2",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchcodec==0.10.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
edge = [
    "onnx==1.22.0",
    "onnxruntime==1.27.0",
    "onnxscript==0.7.1",
    "psutil==7.2.2",
]
docs = [
    "pdfplumber==0.11.9",
    "pypdf==6.10.0",
    "reportlab==4.4.9",
]

[tool.setuptools.packages.find]
include = ["edge_underwater*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
